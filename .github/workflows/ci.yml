name: CI

# Runs on every pull request and on pushes to main.
# Stages, cheapest first, so a broken build fails in about a minute:
#   1. unit:  Go vet + unit/handler tests with coverage (no Docker)
#   2. e2e:   docker compose stack -> Go integration -> pytest API + BDD
#             -> Allure report -> k6 smoke test as a performance quality gate
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the run for the previous commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ALLURE_VERSION: "3.19.1"

jobs:
  unit:
    name: Go unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./... && go vet -tags integration ./...

      - name: Unit tests (race detector + coverage)
        run: go test -race -coverprofile=coverage.out -coverpkg=./internal/... ./...

      - name: Coverage summary
        run: |
          {
            echo "### Go unit test coverage"
            echo '```'
            go tool cover -func=coverage.out | grep -E '^total|/(bank|httpapi|money|idempotency)/' | awk '{print $1, $NF}' | column -t
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: service/coverage.out

  e2e:
    name: Integration, API, BDD and k6 smoke
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Start stack (api + mysql + redis)
        run: docker compose up -d --build --wait

      - name: Go integration tests (real MySQL)
        working-directory: service
        env:
          MYSQL_DSN: "bank:bank@tcp(localhost:3306)/bank?parseTime=true&loc=UTC"
        run: go test -race -count=1 -tags integration ./internal/store/mysqlstore/ -v

      - name: Install Python test dependencies
        run: pip install -r tests/requirements.txt

      - name: API + BDD tests
        id: pytest
        working-directory: tests
        env:
          TEST_ENV: ci
        run: python -m pytest --junitxml=junit.xml

      # The remaining steps run even if pytest failed: a red PR should still
      # come with its report, and with the perf gate result.
      - name: Generate Allure report
        if: ${{ !cancelled() }}
        working-directory: tests
        run: |
          npx --yes "allure@${ALLURE_VERSION}" generate allure-results
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          stats = json.load(open("allure-report/summary.json"))["stats"]
          print("### API + BDD tests")
          print("| Total | Passed | Failed | Broken | Skipped |")
          print("|---|---|---|---|---|")
          print(f"| {stats.get('total', 0)} | {stats.get('passed', 0)} | {stats.get('failed', 0)} | {stats.get('broken', 0)} | {stats.get('skipped', 0)} |")
          print("\nDownload the **allure-report** artifact and open `index.html` for request/response details.")
          EOF

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: |
            tests/allure-report
            tests/junit.xml

      - name: k6 smoke test (quality gate)
        if: ${{ !cancelled() }}
        run: docker compose run --rm k6 run --summary-export=results/smoke-summary.json smoke.js

      - name: k6 summary
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/k6_summary.py perf/results/smoke-summary.json "k6 smoke test" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload k6 results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: k6-smoke
          path: perf/results/smoke-summary.json

      - name: Service logs
        if: ${{ failure() }}
        run: docker compose logs --no-color api mysql redis

      - name: Stop stack
        if: ${{ always() }}
        run: docker compose down -v
