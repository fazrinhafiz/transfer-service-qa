# Local and CI test environment. Credentials here are for throwaway test
# containers only.
name: transfer-service

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bank
      MYSQL_USER: bank
      MYSQL_PASSWORD: bank
    volumes:
      # Scripts in this directory run once, when the database is first created.
      - ./service/migrations:/docker-entrypoint-initdb.d:ro
    # Data lives in memory: every `up` starts from a clean, migrated schema,
    # which keeps test runs repeatable (and fast).
    tmpfs:
      - /var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      # TCP to 127.0.0.1 only succeeds once init scripts have finished and
      # the real server is up (the init phase runs with networking disabled).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ubank", "-pbank", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:8.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./service
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "bank:bank@tcp(mysql:3306)/bank?parseTime=true&loc=UTC"
      REDIS_ADDR: "redis:6379"
      LOG_LEVEL: "INFO"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
