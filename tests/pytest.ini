[pytest]
testpaths = api bdd
pythonpath = .
bdd_features_base_dir = bdd/features
addopts = -ra --strict-markers --alluredir=allure-results --clean-alluredir
markers =
    smoke: fast happy-path checks, safe to run against any environment
    validation: request validation rules
    limits: per-transaction and daily limits
    idempotency: Idempotency-Key behaviour
    concurrency: parallel requests against shared state
    money: sen precision and display formatting
